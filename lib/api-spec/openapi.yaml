openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: admin
    description: Admin user management (superuser + admin only)
  - name: passports
    description: Passport extraction operations
  - name: companies
    description: Company management
  - name: loa
    description: Letter of Appointment operations
  - name: loa-options
    description: Reusable dropdown options for LOA form (work types, work sites, job titles)
  - name: clients
    description: Client / placement management (where candidates are allocated)
  - name: billing
    description: Invoices and quotations
  - name: passwords
    description: Shared password vault (website / app credentials)
  - name: tasks
    description: Daily task manager with subtasks and notes
  - name: xpat
    description: Maldives Xpat MV work permit lookup (proxy)
  - name: salary-records
    description: Monthly salary records per employee (admin generates, employee views)
paths:
  /u/{userId}:
    get:
      operationId: getPublicUserProfile
      tags: [auth]
      summary: Get public user profile (no auth required)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Public user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUserProfile"
        "404":
          description: User not found

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getAuthStatus
      tags: [auth]
      summary: Returns current auth status and user info
      responses:
        "200":
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                  userId:
                    type: integer
                    nullable: true
                  email:
                    type: string
                    nullable: true
                  name:
                    type: string
                    nullable: true
                  role:
                    type: string
                    nullable: true
                  phone:
                    type: string
                    nullable: true
                  designation:
                    type: string
                    nullable: true
                  companyId:
                    type: integer
                    nullable: true
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update own profile (name, phone, designation, companyId)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Create a new account (pending admin approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "202":
          description: Account created, pending approval
        "409":
          description: Email already registered

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in — body contains the session token for mobile Bearer auth
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
        "401":
          description: Invalid password

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out and destroy the session
      responses:
        "204":
          description: Logged out

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Update the application password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password updated
        "400":
          description: Invalid input
        "401":
          description: Current password is incorrect

  /auth/extension-token:
    get:
      operationId: getExtensionToken
      tags: [auth]
      summary: Get the extension API token (generates one on first call)
      responses:
        "200":
          description: Token value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionToken"
        "401":
          description: Authentication required

  /auth/extension-token/regenerate:
    post:
      operationId: regenerateExtensionToken
      tags: [auth]
      summary: Rotate the extension API token (old token immediately invalidated)
      responses:
        "200":
          description: New token value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExtensionToken"
        "401":
          description: Authentication required

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (superuser + admin only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
    post:
      operationId: createUser
      tags: [admin]
      summary: Create a new user (superuser + admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserInput"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          description: Validation error
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
        "409":
          description: Email already registered

  /admin/users/{id}:
    patch:
      operationId: updateUser
      tags: [admin]
      summary: Update a user (role, isApproved, name, password reset)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "404":
          description: User not found
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: User not found

  /admin/permissions:
    get:
      operationId: listPermissions
      tags: [admin]
      summary: List all role-module permissions (superuser only)
      responses:
        "200":
          description: Permissions matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolePermission"
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions
    put:
      operationId: updatePermissions
      tags: [admin]
      summary: Bulk-upsert role-module permissions (superuser only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/RolePermission"
      responses:
        "200":
          description: Updated permissions matrix
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RolePermission"
        "400":
          description: Validation error
        "401":
          description: Authentication required
        "403":
          description: Insufficient permissions

  /system/settings:
    get:
      operationId: getSystemSettings
      tags: [system]
      summary: Read tenant system settings (app name, theme)
      responses:
        "200":
          description: System settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"
    patch:
      operationId: updateSystemSettings
      tags: [system]
      summary: Update tenant system settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemSettingsInput"
      responses:
        "200":
          description: Updated system settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSettings"

  /passports:
    get:
      operationId: listPassports
      tags: [passports]
      summary: List all passport records
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: nationality
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          description: Filter by allocated client. Pass `none` for unallocated candidates.
          schema:
            type: string
        - name: companyId
          in: query
          description: Filter by company ID. Pass `none` for candidates with no company.
          schema:
            type: string
      responses:
        "200":
          description: List of passport records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Passport"

  /passports/upload:
    post:
      operationId: uploadPassport
      tags: [passports]
      summary: Upload passport image/PDF for OCR extraction
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PassportUpload"
      responses:
        "201":
          description: Passport record created with extracted data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "400":
          description: Invalid file

  /passports/stats:
    get:
      operationId: getPassportStats
      tags: [passports]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Passport statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassportStats"

  /passports/{id}:
    get:
      operationId: getPassport
      tags: [passports]
      summary: Get a single passport record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Passport record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "404":
          description: Not found
    patch:
      operationId: updatePassport
      tags: [passports]
      summary: Update a passport record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PassportUpdate"
      responses:
        "200":
          description: Updated passport record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passport"
        "404":
          description: Not found
    delete:
      operationId: deletePassport
      tags: [passports]
      summary: Delete a passport record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List all companies
      parameters:
        - name: withBranding
          in: query
          description: When true, include letterheadImage and signatureImage (heavy base64 fields). Defaults to false.
          schema:
            type: boolean
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Created company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    patch:
      operationId: updateCompany
      tags: [companies]
      summary: Update a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyUpdate"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Not found
    delete:
      operationId: deleteCompany
      tags: [companies]
      summary: Delete a company
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /loa:
    get:
      operationId: listLoa
      tags: [loa]
      summary: List all LOA entries
      parameters:
        - name: passportId
          in: query
          required: false
          schema:
            type: integer
          description: Filter entries by passport ID
      responses:
        "200":
          description: List of LOA entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Loa"
    post:
      operationId: createLoa
      tags: [loa]
      summary: Create a LOA entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoaInput"
      responses:
        "201":
          description: Created LOA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loa"

  /loa/{id}:
    get:
      operationId: getLoa
      tags: [loa]
      summary: Get a single LOA entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: LOA entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loa"
        "404":
          description: Not found
    patch:
      operationId: updateLoa
      tags: [loa]
      summary: Update a LOA entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoaUpdate"
      responses:
        "200":
          description: Updated LOA
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Loa"
        "404":
          description: Not found
    delete:
      operationId: deleteLoa
      tags: [loa]
      summary: Delete a LOA entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
    post:
      operationId: createClient
      tags: [clients]
      summary: Create a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"

  /clients/{id}:
    patch:
      operationId: updateClient
      tags: [clients]
      summary: Update a client
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found
    delete:
      operationId: deleteClient
      tags: [clients]
      summary: Delete a client (also unlinks any allocated candidates)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /expense-categories:
    get:
      operationId: listExpenseCategories
      tags: [expenses]
      summary: List expense categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpenseCategory"
    post:
      operationId: createExpenseCategory
      tags: [expenses]
      summary: Create an expense category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategory"
        "409":
          description: A category with this name already exists

  /expense-categories/{id}:
    patch:
      operationId: updateExpenseCategory
      tags: [expenses]
      summary: Update an expense category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseCategoryUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseCategory"
        "404":
          description: Not found
        "409":
          description: Another category with this name already exists
    delete:
      operationId: deleteExpenseCategory
      tags: [expenses]
      summary: Delete an expense category (refused if expenses still reference it)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
        "409":
          description: Category is in use by one or more expenses

  /expenses:
    get:
      operationId: listExpenses
      tags: [expenses]
      summary: List expenses (newest first)
      parameters:
        - name: categoryId
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of expenses with joined category name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Expense"
    post:
      operationId: createExpense
      tags: [expenses]
      summary: Create an expense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Invalid input or unknown category

  /expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [expenses]
      summary: Update an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExpenseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          description: Invalid input or unknown category
        "404":
          description: Not found
    delete:
      operationId: deleteExpense
      tags: [expenses]
      summary: Delete an expense
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /passwords:
    get:
      operationId: listPasswords
      tags: [passwords]
      summary: List password entries
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of passwords
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Password"
    post:
      operationId: createPassword
      tags: [passwords]
      summary: Create a password entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Password"
        "400":
          description: Invalid input

  /passwords/{id}:
    patch:
      operationId: updatePassword
      tags: [passwords]
      summary: Update a password entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Password"
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deletePassword
      tags: [passwords]
      summary: Delete a password entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List all tasks (top-level and subtasks)
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task or subtask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input

  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task (cascades to subtasks)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /xpat/work-permit:
    get:
      operationId: getXpatWorkPermit
      tags: [xpat]
      summary: Look up Xpat MV work permit data for a candidate
      parameters:
        - name: workPermitNumber
          in: query
          required: true
          schema:
            type: string
        - name: passportNumber
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Xpat work permit data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XpatWorkPermit"
        "400":
          description: Missing required parameters
        "401":
          description: Authentication required
        "502":
          description: Upstream Xpat API unreachable

  /billing/documents:
    get:
      operationId: listBillingDocuments
      tags: [billing]
      summary: List invoices and quotations
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [invoice, quotation]
        - name: search
          in: query
          schema:
            type: string
        - name: clientId
          in: query
          description: Filter by client ID
          schema:
            type: integer
      responses:
        "200":
          description: List of billing documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BillingDocumentSummary"
    post:
      operationId: createBillingDocument
      tags: [billing]
      summary: Create an invoice or quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDocumentCreated"
        "400":
          description: Invalid input

  /billing/documents/{id}:
    get:
      operationId: getBillingDocument
      tags: [billing]
      summary: Get an invoice or quotation with line items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingDocument"
        "404":
          description: Not found
    patch:
      operationId: updateBillingDocument
      tags: [billing]
      summary: Update an invoice or quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BillingDocumentUpdate"
      responses:
        "204":
          description: Updated
        "400":
          description: Invalid input
        "404":
          description: Not found
    delete:
      operationId: deleteBillingDocument
      tags: [billing]
      summary: Delete an invoice or quotation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /loa-options:
    get:
      operationId: listLoaOptions
      tags: [loa-options]
      summary: List LOA dropdown options for a company
      parameters:
        - name: companyId
          in: query
          required: true
          description: Company ID to scope options to.
          schema:
            type: integer
        - name: category
          in: query
          description: Filter by category (work_type, work_site, job_title)
          schema:
            type: string
            enum: [work_type, work_site, job_title]
      responses:
        "200":
          description: List of options
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LoaOption"
    post:
      operationId: createLoaOption
      tags: [loa-options]
      summary: Add a new LOA dropdown option
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoaOptionInput"
      responses:
        "201":
          description: Created option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoaOption"
        "409":
          description: Option already exists in this category

  /loa-options/{id}:
    patch:
      operationId: updateLoaOption
      tags: [loa-options]
      summary: Rename a LOA dropdown option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoaOptionInput"
      responses:
        "200":
          description: Updated option
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoaOption"
        "404":
          description: Not found
        "409":
          description: Another option with this value already exists in this category
    delete:
      operationId: deleteLoaOption
      tags: [loa-options]
      summary: Delete a LOA dropdown option
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /salary-records:
    get:
      operationId: listSalaryRecords
      tags: [salary-records]
      summary: List salary records (admin sees all; employee sees own via linkedEntityId)
      parameters:
        - name: passportId
          in: query
          schema: { type: integer }
        - name: month
          in: query
          schema: { type: integer }
        - name: year
          in: query
          schema: { type: integer }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: List of salary records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalaryRecord"
    post:
      operationId: createSalaryRecord
      tags: [salary-records]
      summary: Create a salary record (admin/superuser only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalaryRecord"
      responses:
        "201":
          description: Created salary record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryRecord"
        "409":
          description: Record already exists for this employee/month/year

  /salary-records/{id}:
    patch:
      operationId: updateSalaryRecord
      tags: [salary-records]
      summary: Update a salary record (admin/superuser only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalaryRecord"
      responses:
        "200":
          description: Updated salary record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalaryRecord"
        "404":
          description: Not found
    delete:
      operationId: deleteSalaryRecord
      tags: [salary-records]
      summary: Delete a salary record (admin/superuser only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UpdateProfileInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        companyId:
          type: integer
          nullable: true

    UserProfile:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        phone:
          type: string
          nullable: true
        designation:
          type: string
          nullable: true
        companyId:
          type: integer
          nullable: true

    ExtensionToken:
      type: object
      required: [token]
      properties:
        token:
          type: string

    AdminUser:
      type: object
      required: [id, email, name, role, isApproved, isBlocked, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        role:
          type: string
        isApproved:
          type: boolean
        isBlocked:
          type: boolean
        linkedEntityId:
          type: string
          nullable: true
        hasPassword:
          type: boolean
        createdAt:
          type: string
          format: date-time

    AdminUserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        role:
          type: string
        isApproved:
          type: boolean
        isBlocked:
          type: boolean
        linkedEntityId:
          type: string
          nullable: true
        newPassword:
          type: string
          minLength: 6
          nullable: true

    RolePermission:
      type: object
      required: [role, module, canView, canEdit, canDelete]
      properties:
        role:
          type: string
        module:
          type: string
        canView:
          type: boolean
        canEdit:
          type: boolean
        canDelete:
          type: boolean

    CreateUserInput:
      type: object
      required: [email, name, role, password, isApproved]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        role:
          type: string
        password:
          type: string
          minLength: 6
        isApproved:
          type: boolean
        linkedEntityId:
          type: string
          nullable: true

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 6
        name:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 6
          maxLength: 200

    SystemSettings:
      type: object
      required: [appName, accentHue, hasCustomPassword, hasOpenAiApiKey]
      properties:
        appName:
          type: string
        accentHue:
          type: integer
          minimum: 0
          maximum: 360
        companyName:
          type: string
          nullable: true
        companyAddress:
          type: string
          nullable: true
        companyPhone:
          type: string
          nullable: true
        companyEmail:
          type: string
          nullable: true
        companyWebsite:
          type: string
          nullable: true
        companyRegistrationNumber:
          type: string
          nullable: true
        logoImage:
          type: string
          nullable: true
          description: Inline base64 data URL (PNG/JPEG, ≤600KB).
        hasCustomPassword:
          type: boolean
          description: True if a DB-stored password override is set; false means env APP_PASSWORD is in use.
        hasOpenAiApiKey:
          type: boolean
          description: True if a user-supplied OpenAI API key is stored in the database.
    SystemSettingsInput:
      type: object
      properties:
        appName:
          type: string
          minLength: 1
          maxLength: 60
        accentHue:
          type: integer
          minimum: 0
          maximum: 360
        companyName:
          type: string
          nullable: true
          maxLength: 200
        companyAddress:
          type: string
          nullable: true
          maxLength: 500
        companyPhone:
          type: string
          nullable: true
          maxLength: 50
        companyEmail:
          type: string
          nullable: true
          maxLength: 200
        companyWebsite:
          type: string
          nullable: true
          maxLength: 200
        companyRegistrationNumber:
          type: string
          nullable: true
          maxLength: 100
        logoImage:
          type: string
          nullable: true
        openaiApiKey:
          type: string
          nullable: true
          description: Set to a valid OpenAI API key to use your own account; null to clear and fall back to Replit AI Integrations.
    LoaOption:
